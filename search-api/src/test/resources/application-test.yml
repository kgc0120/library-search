spring:
  config:
    activate:
      on-profile: test
external:
  naver:
    url: https://openapi.naver.com
    headers:
      client-id: 123
      client-secret: 123
  kakao:
    url: https://dapi.kakao.com
    headers:
      rest-api-key: test
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 100
        minimumNumberOfCalls: 10
        wait-duration-in-open-state:
          seconds: 20
        failureRateThreshold: 50
        permitted-number-of-calls-in-half-open-state: 10
